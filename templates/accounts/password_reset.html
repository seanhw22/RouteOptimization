{% extends 'base.html' %}
{% block title %}Reset password · MDVRP{% endblock %}
{% block content %}
<section class="card">
    <h1>Reset password</h1>
    <p class="muted">Enter your email address and we'll send you a link to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        <div class="field">
            <label for="id_email">Email</label>
            {{ form.email }}
            {{ form.email.errors }}
        </div>
        <button type="submit" class="primary">Send reset link</button>
    </form>
    <p class="muted"><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
</section>
{% endblock %}
